apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-web
  namespace: learning
spec:
  replicas: 1
  selector: {matchLabels: {app: network-web}}
  template:
    metadata: {labels: {app: network-web}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: network-web
  namespace: learning
spec:
  selector: {app: network-web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: learning
  labels: {access: allowed}
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: learning
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
