apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-nginx-config
  namespace: learning
data:
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; }
      location /ready { try_files /ready =503; }
      location /healthy { try_files /healthy =500; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  namespace: learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command: ["sh", "-c"]
          args:
            - |
              touch /usr/share/nginx/html/ready /usr/share/nginx/html/healthy
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthy, port: http}
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: nginx-config
          configMap:
            name: probe-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: probe-demo
  namespace: learning
spec:
  selector: {app: probe-demo}
  ports:
    - port: 80
      targetPort: http
