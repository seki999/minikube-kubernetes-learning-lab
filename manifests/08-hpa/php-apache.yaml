apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: learning
spec:
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example:1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
            limits:
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: learning
spec:
  selector:
    run: php-apache
  ports:
    - port: 80
