apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  namespace: learning
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "touch /data/history.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-pvc
