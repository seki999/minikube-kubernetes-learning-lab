apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: learning
spec:
  clusterIP: None
  selector: {app: stateful-nginx}
  ports:
    - name: web
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: learning
spec:
  serviceName: nginx
  replicas: 2
  selector:
    matchLabels: {app: stateful-nginx}
  template:
    metadata:
      labels: {app: stateful-nginx}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: web
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
